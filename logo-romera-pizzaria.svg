<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -46 560 526" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Romera &amp; Romera Pizzaria</title>
  <defs>
    <!-- Grão de trigo em traço, herdado da logo da padaria -->
    <path id="grain" d="M0 0 C-12 -8 -14 -28 0 -42 C14 -28 12 -8 0 0Z" fill="none" stroke="#C8962E" stroke-width="4" stroke-linejoin="round"/>
    <g id="ear">
      <path d="M0 0 C-2 -80 -1 -160 0 -236" fill="none" stroke="#C8962E" stroke-width="4" stroke-linecap="round"/>
      <use href="#grain" transform="translate(0 -232)"/>
      <use href="#grain" transform="translate(-1 -200) rotate(-32)"/>
      <use href="#grain" transform="translate(1 -200) rotate(32)"/>
      <use href="#grain" transform="translate(-1 -166) rotate(-36)"/>
      <use href="#grain" transform="translate(1 -166) rotate(36)"/>
      <use href="#grain" transform="translate(-1 -132) rotate(-40)"/>
      <use href="#grain" transform="translate(1 -132) rotate(40)"/>
      <g stroke="#C8962E" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M-4 -272 L-14 -330"/><path d="M0 -276 L0 -338"/><path d="M4 -272 L14 -330"/>
      </g>
    </g>
    <!-- Folha de trigo (traço) e folha de manjericão (novo ingrediente, verde) -->
    <path id="leaf" d="M0 0 C-10 -14 -10 -40 0 -58 C10 -40 10 -14 0 0Z" fill="none" stroke="#C8962E" stroke-width="4" stroke-linejoin="round"/>
    <g id="basil">
      <path d="M0 0 C-20 -12 -24 -44 0 -66 C24 -44 20 -12 0 0Z" fill="#4E7A3E"/>
      <path d="M0 -4 V-58" stroke="#E7F0D8" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Espigas laterais, mantendo a moldura da padaria -->
  <g transform="translate(74 336) rotate(-6)"><use href="#ear"/></g>
  <g transform="translate(486 336) rotate(6) scale(-1 1)"><use href="#ear"/></g>

  <!-- Hastes que descem e se cruzam, como no original -->
  <g fill="none" stroke="#C8962E" stroke-width="4" stroke-linecap="round">
    <path d="M74 336 C120 400 220 440 322 462"/>
    <path d="M486 336 C440 400 340 440 238 462"/>
  </g>
  <use href="#leaf" transform="translate(118 392) rotate(-112)"/>
  <use href="#leaf" transform="translate(442 392) rotate(112)"/>
  <use href="#basil" transform="translate(150 410) rotate(-150)"/>
  <use href="#basil" transform="translate(410 410) rotate(150)"/>

  <text x="280" y="196" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Charter, Georgia, serif" font-weight="700" font-size="66" fill="#9B2226">ROMERA</text>

  <!-- Faixa com cantos recortados, igual à placa da padaria -->
  <path d="M60 222 H500 a12 12 0 0 0 12 12 V304 a12 12 0 0 0 -12 12 H60 a12 12 0 0 0 -12 -12 V234 a12 12 0 0 0 12 -12Z" fill="#9B2226"/>
  <path d="M68 231 H492 a8 8 0 0 0 8 8 V299 a8 8 0 0 0 -8 8 H68 a8 8 0 0 0 -8 -8 V239 a8 8 0 0 0 8 -8Z" fill="none" stroke="#FFF8EC" stroke-width="2.5"/>
  <text x="280" y="295" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Charter, Georgia, serif" font-weight="700" font-size="68" fill="#FFF8EC">ROMERA</text>

  <!-- O "&" agora é uma pizza vista de cima: borda dourada com 8 cortes -->
  <g transform="translate(280 218)">
    <circle r="27" fill="#E0A948" stroke="#9B2226" stroke-width="3"/>
    <circle r="20" fill="#FFF8EC"/>
    <g stroke="#9B2226" stroke-width="2.4" stroke-linecap="round">
      <path d="M0 -21 V-26"/><path d="M0 21 V26"/><path d="M-21 0 H-26"/><path d="M21 0 H26"/>
      <path d="M14.8 -14.8 L18.4 -18.4"/><path d="M-14.8 14.8 L-18.4 18.4"/><path d="M-14.8 -14.8 L-18.4 -18.4"/><path d="M14.8 14.8 L18.4 18.4"/>
    </g>
    <text y="9" text-anchor="middle" font-family="Cinzel, Charter, Georgia, serif" font-weight="700" font-size="26" fill="#9B2226">&amp;</text>
  </g>

  <text x="280" y="368" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Charter, Georgia, serif" font-weight="700" font-size="38" letter-spacing="5" fill="#C8962E">PIZZARIA</text>
</svg>
